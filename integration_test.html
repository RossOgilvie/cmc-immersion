<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@14.7.0/lib/browser/math.min.js"></script>
    <script src="integration_cc.js"></script>
    <script src="thetafunction.js"></script>
    <script src="spectralg2.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/stdlib-js/math-base-special-ellipj@umd/browser.js"></script>
  </head>
  <body>
    <div id="answer"></div>
    <script>
      f_example = function (x) {
        return math.exp(x)+1;
      }

      xs = cc_interval_points(0,1,3);
      f_example_samples = new Array(xs.length);
      for (n = 0; n < xs.length; n++)
      {
        f_example_samples[n] = f_example(xs[n]);
      }
      let f_inted = cc_int_sample(f_example_samples,0,1,3)

      var node = document.getElementById('answer');
      node.innerHTML += "int f approx <br />";
      node.innerHTML += (f_inted-math.exp(1)).toString();
      node.innerHTML += "<br />";
      node.innerHTML += "<br />";

      let hyp = new Hyperelliptic_Curve();
      hyp.update();
      let ucp = new UnitCirclePath(hyp,5);
      node.innerHTML += "unit circle points <br />";
      node.innerHTML += ucp.xs.toString();
      node.innerHTML += "<br />";
      node.innerHTML += ucp.ys.toString();
      node.innerHTML += "<br />";
      node.innerHTML += "<br />";

      // let spec = new Spectral_Curve();
      // spec.update();
      // node.innerHTML += "unit circle integrations <br />";
      // node.innerHTML += spec.unitcircle_ints().toString();
      // node.innerHTML += "<br />";
      // node.innerHTML += "<br />";
      // node.innerHTML += "a periods <br />";
      // node.innerHTML += spec.a_periods(0).toString();
      // node.innerHTML += "<br />";
      // node.innerHTML += spec.a_periods(1).toString();
      // node.innerHTML += "<br />";
      // node.innerHTML += "<br />";
      // node.innerHTML += "b periods <br />";
      // node.innerHTML += spec.b_periods(0).toString();
      // node.innerHTML += "<br />";
      // node.innerHTML += spec.b_periods(1).toString();
      // node.innerHTML += "<br />";
      // node.innerHTML += "<br />";

      // Test RiemannTheta generator
      node.innerHTML += "RiemannTheta lattice points (g=2, bound=1): <br />";
      const tau_g2 = [[math.complex(0, 1), 0], [0, math.complex(0, 1)]]; // tau = i*I
      const theta_g2 = new RiemannTheta(2, tau_g2);

      const points = [];
      for (const n of theta_g2.latticePoints(1)) {
        points.push(n);
      }
      node.innerHTML += points.map(p => `[${p.join(', ')}]`).join(", ");
      node.innerHTML += "<br />Count: " + points.length;
      node.innerHTML += "<br /><br />";

      // Test the computation at z=0 with g=1
      // q = exp(- pi B)
      const tau_from_nome = - math.log(0.5) / math.PI;
      node.innerHTML += "RiemannTheta computation at z=0 with g=1 and nome q = 0.5: <br />";
      const tau_g1 = [[math.complex(0, tau_from_nome)]]; // 1x1 matrix with entry i*0.5
      const theta_g1 = new RiemannTheta(1, tau_g1);
      const z_test_g1 = [math.complex(0, 0)]; // z = 0

      // Compute with different bounds to show convergence
      const bounds = [2, 3, 4, 5];
      for (const bound of bounds) {
        const result = theta_g1.compute(z_test_g1, bound);
        node.innerHTML += `bound=${bound}: ${result.toString()}<br />`;
      }

      // Compare with direct sum: Theta_3 = sum q^(n^2)
      let direct_sum_g1 = 0;
      for (let n1 = -5; n1 <= 5; n1++) {
          direct_sum_g1 += Math.pow(0.5, n1*n1);
      }
      node.innerHTML += `Direct sum (nome q = 0.5, bound=5): ${direct_sum_g1.toFixed(8)}<br />`;
      node.innerHTML += "Wikipedia value for theta_3(q=0.5) ≈ 2.12893...<br />";
      node.innerHTML += "<br />";
    </script>
  </body>
</html>
