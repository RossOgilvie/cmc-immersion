      mathbox = MathBox.mathBox({

      view = mathbox.cartesian({

        scale: [1, 1, 1],

        r1: 0.5,
        r2: 0.5,
        phi: math.PI/4,
      };
      gui.add(props, "r1").min(0.1).max(0.9).step(0.01).onChange(spectralg2.update.bind(spectralg2));
      gui.add(props, "r2").min(0.1).max(0.9).step(0.01).onChange(spectralg2.update.bind(spectralg2));
      gui.add(props, "phi").min(0).max(math.PI/2).step(0.01).onChange(spectralg2.update.bind(spectralg2));

      
      let surface_function1 = function (emit, u, v, i, j, t) {
          let lam = math.complex({r: u, phi: v});
          let y = math.sqrt(spectralg2.lama_poly(lam));
          prpt = stereo(lam.re, lam.im, y.re, y.im);
          emit(prpt[0],prpt[1],prpt[2]);
        }
      let surface_function2 = function (emit, u, v, i, j, t) {
          let lam = math.complex({r: u, phi: v});
          let y = math.sqrt(spectralg2.lama_poly(lam));
          prpt = stereo(lam.re, lam.im, -y.re, -y.im);
          emit(prpt[0],prpt[1],prpt[2]);
        }

      let stereo = function (x,y,z,w) {
        // We actually want to preserve the first two coordinates. We also want to fix the second two coordinates for (0,0). Do a modify stereo proj on (z,w)
        // scal = math.sqrt(z**2 + (w-1)**2);

        // scal = 1 - (z**2 + w**2)
        // return [x/scal, y/scal ,z/scal]

        //just smash
        // return [x, y ,z**2 + w**2]
        return [x, y ,z]
      }
